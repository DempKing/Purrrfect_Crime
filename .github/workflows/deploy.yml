name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp dist/index.html site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Publishing only happens once GitHub Pages is switched on for this repository
      # (Settings → Pages → Source: GitHub Actions), so the workflow stays green until then.
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publish only when Pages is set to deploy from GitHub Actions. Otherwise say why and stay green.
          resp=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          code=$(echo "$resp" | tail -n1)
          if [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off. Turn it on in Settings → Pages → Source: GitHub Actions to publish the game."
          elif [ "$code" = "200" ] && ! echo "$resp" | grep -q '"build_type": *"workflow"'; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is set to 'Deploy from a branch', which publishes the raw source instead of the built game. Change Settings → Pages → Source to GitHub Actions."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    if: needs.build.outputs.pages == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
