name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r dist/. site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Publishing only happens once GitHub Pages is switched on for this repository
      # (Settings → Pages → Source: GitHub Actions), so the workflow stays green until then.
      # Publishing needs Pages set to deploy from GitHub Actions. If it's off or set to a branch, try to
      # switch it with this workflow's token; if GitHub doesn't allow that, say what to change and stay green.
      - name: Make sure GitHub Pages publishes from Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          call() { curl -s -o /tmp/pages.json -w '%{http_code}' -X "$1" -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api" ${2:+-d "$2"}; }
          code=$(call GET)
          echo "Pages: HTTP $code"; cat /tmp/pages.json; echo
          if [ "$code" = "200" ] && grep -q '"build_type": *"workflow"' /tmp/pages.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$code" = "404" ]; then try=$(call POST '{"build_type":"workflow"}'); else try=$(call PUT '{"build_type":"workflow"}'); fi
          echo "Switching to GitHub Actions: HTTP $try"; cat /tmp/pages.json; echo
          if [ "$try" = "201" ] || [ "$try" = "204" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages isn't publishing from GitHub Actions, and this workflow isn't allowed to change that. Set Settings → Pages → Source to GitHub Actions."
          fi

  deploy:
    if: needs.build.outputs.pages == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Fetch the live page as a visitor would and make sure it's the built game, not the raw source.
      - name: Check the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            curl -sL -H 'Cache-Control: no-cache' "$url?check=$GITHUB_SHA" -o page.html -w '%{http_code} %{size_download}\n' > status.txt || true
            if grep -q 'pixi' page.html && ! grep -q '<!-- SCRIPT -->' page.html; then
              echo "::notice::Live site OK: $url serves the built game ($(cat status.txt) bytes)."; exit 0
            fi
            sleep 20
          done
          echo "::warning::Live site check: $url answered $(cat status.txt) but doesn't look like the built game. First lines: $(head -c 300 page.html | tr '\n' ' ')"
